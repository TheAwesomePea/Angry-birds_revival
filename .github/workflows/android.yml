name: Build Angry Birds Revival APK (New Game)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar dependencias, Capacitor y Assets
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets sharp

      - name: Descomprimir new-game.zip en carpeta web (www)
        run: |
          mkdir -p www
          unzip -o new-game.zip -d www/

      - name: Inicializar Android y generar iconos desde icon.png
        run: |
          npx cap init "Angry Birds Revival" "com.luiginumbertwo222.angrybirdsrevival" --web-dir www
          npx cap add android
          mkdir -p assets
          node -e "require('sharp')('icon.png').resize(1024, 1024).toFile('assets/icon.png')"
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Corregir conflicto de versiones Kotlin en Gradle
        run: |
          cat << 'EOF' >> android/app/build.gradle
          dependencies {
              implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
          }
          EOF

      - name: Compilar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Revival-1.0.1
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
