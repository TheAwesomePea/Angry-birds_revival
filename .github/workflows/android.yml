name: Build Angry Birds Revival APK (New Game)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Descomprimir new-game.zip en carpeta web (www)
        run: |
          mkdir -p www
          unzip -o new-game.zip -d www/
          cp icon.png www/

      - name: Inicializar Android con el paquete original
        run: |
          npx cap init "Angry Birds Revival" "com.luiginumbertwo222.angrybirdsrevival" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Revival-1.0.2
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
