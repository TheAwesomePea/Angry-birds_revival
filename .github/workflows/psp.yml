name: Build PSP Homebrew
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  prepare-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extraer texturas y sonidos de new-game.zip
        run: |
          npm install sharp
          mkdir -p psp_assets/romfs/img psp_assets/romfs/snd tmp
          unzip -o new-game.zip -d tmp/
          node -e "require('sharp')('icon.png').resize(144, 80).png().toFile('psp_assets/ICON0.PNG')"
          node -e "
            const fs = require('fs');
            let ic = 0, sc = 0;
            const walk = d => fs.readdirSync(d).forEach(f => {
              const p = d + '/' + f;
              if (fs.statSync(p).isDirectory()) return walk(p);
              if (!p.endsWith('.js') && !p.endsWith('.html')) return;
              const txt = fs.readFileSync(p, 'utf8');
              const rx = /([a-zA-Z0-9_\"' \-]{0,30})[:=]\s*[\"\'](data:(image|audio)\/([a-z0-9+-]+);base64,([A-Za-z0-9+\/=]+))[\"\']/g;
              let m;
              while ((m = rx.exec(txt)) !== null) {
                const nm = m.at(1).replace(/[^a-zA-Z0-9_]/g, '');
                const ext = m.at(4).replace('jpeg', 'jpg').replace('mpeg', 'mp3');
                const buf = Buffer.from(m.at(5), 'base64');
                if (m.at(3) === 'image') fs.writeFileSync('psp_assets/romfs/img/' + String(ic++).padStart(2,'0') + '_' + nm + '.' + ext, buf);
                else fs.writeFileSync('psp_assets/romfs/snd/' + String(sc++).padStart(2,'0') + '_' + nm + '.' + ext, buf);
              }
            });
            walk('tmp');
            console.log('Extraidos:', ic, 'imagenes y', sc, 'sonidos');
          "
      - uses: actions/upload-artifact@v4
        with:
          name: psp-prepared-assets
          path: psp_assets

  build-psp:
    needs: prepare-assets
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: psp-prepared-assets
          path: psp
      - name: Compilar EBOOT.PBP en PSPDEV
        working-directory: psp
        run: |
          cat << 'EOF' > main.c
          #include <pspkernel.h>
          #include <pspctrl.h>
          #include <SDL2/SDL.h>
          #include <SDL2/SDL_image.h>
          #include <SDL2/SDL_mixer.h>
          #include <dirent.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <math.h>
          PSP_MODULE_INFO("AngryBirdsRevival", 0, 1, 0);
          PSP_MAIN_THREAD_ATTR(THREAD_ATTR_USER | THREAD_ATTR_VFPU);
          SDL_Texture* load_tex(SDL_Renderer *r, const char *kw, int idx) {
              DIR *d = opendir("romfs/img"); if (!d) return NULL;
              struct dirent *e; char *fb = calloc(1, 512), *p = calloc(1, 512); int c = 0;
              while ((e = readdir(d))) {
                  if (*(e->d_name) == '.') continue;
                  snprintf(p, 512, "romfs/img/%s", e->d_name);
                  if (c++ == idx) strncpy(fb, p, 511);
                  if (strstr(e->d_name, kw)) { closedir(d); SDL_Texture *t = IMG_LoadTexture(r, p); free(fb); free(p); return t; }
              }
              closedir(d); SDL_Texture *t = *fb ? IMG_LoadTexture(r, fb) : NULL; free(fb); free(p); return t;
          }
          Mix_Chunk* load_snd(const char *kw, int idx) {
              DIR *d = opendir("romfs/snd"); if (!d) return NULL;
              struct dirent *e; char *fb = calloc(1, 512), *p = calloc(1, 512); int c = 0;
              while ((e = readdir(d))) {
                  if (*(e->d_name) == '.') continue;
                  snprintf(p, 512, "romfs/snd/%s", e->d_name);
                  if (c++ == idx) strncpy(fb, p, 511);
                  if (strstr(e->d_name, kw)) { closedir(d); Mix_Chunk *s = Mix_LoadWAV(p); free(fb); free(p); return s; }
              }
              closedir(d); Mix_Chunk *s = *fb ? Mix_LoadWAV(fb) : NULL; free(fb); free(p); return s;
          }
          int main() {
              SDL_Init(SDL_INIT_VIDEO | SDL_INIT_AUDIO); IMG_Init(IMG_INIT_PNG | IMG_INIT_JPG);
              Mix_OpenAudio(44100, MIX_DEFAULT_FORMAT, 2, 2048);
              SDL_Window *w = SDL_CreateWindow("ABR", 0, 0, 480, 272, 0);
              SDL_Renderer *r = SDL_CreateRenderer(w, -1, SDL_RENDERER_ACCELERATED | SDL_RENDERER_PRESENTVSYNC);
              SDL_Texture *bg = load_tex(r, "bg", 0), *bd = load_tex(r, "bird", 1), *pg = load_tex(r, "pig", 2);
              Mix_Chunk *sl = load_snd("launch", 0), *sh = load_snd("hit", 1);
              sceCtrlSetSamplingCycle(0); sceCtrlSetSamplingMode(PSP_CTRL_MODE_ANALOG);
              float bx = 80, by = 200, vx = 0, vy = 0, ang = -0.6f, pwr = 9.0f;
              int act = 0, run = 1, a0 = 1, a1 = 1, a2 = 1;
              SceCtrlData pad;
              while (run) {
                  sceCtrlReadBufferPositive(&pad, 1);
                  if (pad.Buttons & PSP_CTRL_START) run = 0;
                  if (!act) {
                      if (pad.Buttons & PSP_CTRL_UP) ang -= 0.03f;
                      if (pad.Buttons & PSP_CTRL_DOWN) ang += 0.03f;
                      if (pad.Buttons & PSP_CTRL_RIGHT) pwr += 0.15f;
                      if (pad.Buttons & PSP_CTRL_LEFT) pwr -= 0.15f;
                      bx = 80; by = 200;
                      if (pad.Buttons & PSP_CTRL_CROSS) { vx = cosf(ang)*pwr; vy = sinf(ang)*pwr; act = 1; if (sl) Mix_PlayChannel(-1, sl, 0); }
                  } else {
                      bx += vx; by += vy; vy += 0.25f;
                      if (a0 && bx+12>350 && bx-12<376 && by+12>210 && by-12<236) { a0=0; if (sh) Mix_PlayChannel(-1, sh, 0); }
                      if (a1 && bx+12>405 && bx-12<431 && by+12>210 && by-12<236) { a1=0; if (sh) Mix_PlayChannel(-1, sh, 0); }
                      if (a2 && bx+12>378 && bx-12<404 && by+12>175 && by-12<201) { a2=0; if (sh) Mix_PlayChannel(-1, sh, 0); }
                      if (bx > 500 || by > 240 || (pad.Buttons & PSP_CTRL_CIRCLE)) act = 0;
                  }
                  if (pad.Buttons & PSP_CTRL_TRIANGLE) { a0=1; a1=1; a2=1; act=0; }
                  if (bg) SDL_RenderCopy(r, bg, NULL, NULL); else { SDL_SetRenderDrawColor(r, 110, 190, 255, 255); SDL_RenderClear(r); }
                  if (a0) { SDL_Rect rc = {350, 210, 26, 26}; if (pg) SDL_RenderCopy(r, pg, NULL, &rc); else { SDL_SetRenderDrawColor(r, 139, 195, 74, 255); SDL_RenderFillRect(r, &rc); } }
                  if (a1) { SDL_Rect rc = {405, 210, 26, 26}; if (pg) SDL_RenderCopy(r, pg, NULL, &rc); else { SDL_SetRenderDrawColor(r, 139, 195, 74, 255); SDL_RenderFillRect(r, &rc); } }
                  if (a2) { SDL_Rect rc = {378, 175, 26, 26}; if (pg) SDL_RenderCopy(r, pg, NULL, &rc); else { SDL_SetRenderDrawColor(r, 139, 195, 74, 255); SDL_RenderFillRect(r, &rc); } }
                  SDL_Rect br = {(int)bx-12, (int)by-12, 24, 24};
                  if (bd) SDL_RenderCopy(r, bd, NULL, &br); else { SDL_SetRenderDrawColor(r, 229, 57, 53, 255); SDL_RenderFillRect(r, &br); }
                  SDL_RenderPresent(r);
              }
              SDL_Quit(); sceKernelExitGame(); return 0;
          }
          EOF
          cat << 'EOF' > Makefile
          TARGET = AngryBirdsRevival
          OBJS = main.o
          CFLAGS = -O2 -G0 -Wall -I$(shell psp-config --psp-prefix)/include/SDL2
          LIBS = -lSDL2_image -lSDL2_mixer -lSDL2 -lpng -ljpeg -logg -lvorbis -lvorbisfile -lpspgu -lpspgum -lpspctrl -lpspaudio -lpsphprm -lpsppower -lm
          EXTRA_TARGETS = EBOOT.PBP
          PSP_EBOOT_TITLE = Angry Birds Revival
          PSP_EBOOT_ICON = ICON0.PNG
          PSPSDK=$(shell psp-config --pspsdk-path)
          include $(PSPSDK)/lib/build.mak
          EOF
          make
      - name: Empaquetar y subir PSP
        run: |
          mkdir -p out/AngryBirdsRevival
          cp psp/EBOOT.PBP out/AngryBirdsRevival/
          cp -r psp/romfs out/AngryBirdsRevival/
          cd out && zip -r ../Angry-Birds-Revival-PSP.zip AngryBirdsRevival
      - uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Revival-PSP
          path: Angry-Birds-Revival-PSP.zip
          
