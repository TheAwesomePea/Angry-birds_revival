name: Build Windows EXE
on: [workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          tar -xf game.zip
          Get-ChildItem -Recurse -Include index.html,style.css,game.js,birdjs.js,assets.js | Move-Item -Destination . -Force
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: AngryBirdsRevival-Windows
          path: dist/*.exe
          
