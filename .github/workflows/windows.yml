name: Build Linux Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraer new-game.zip
        run: unzip -o new-game.zip -d .

      - name: Instalar dependencias y redimensionar icono
        run: |
          npm install
          npm install sharp
          node -e "require('sharp')('icon.png').resize(512, 512).toFile('icon_512.png').then(() => require('fs').renameSync('icon_512.png', 'icon.png'))"

      - name: Compilar paquete Linux (.AppImage)
        run: npx electron-builder --linux AppImage --publish never

      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Revival-Linux
          path: dist/*.AppImage
          
