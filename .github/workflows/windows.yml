name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraer new-game.zip
        shell: bash
        run: unzip -o new-game.zip -d .

      - name: Instalar dependencias
        run: npm install

      - name: Redimensionar icon.ico a 256x256
        run: |
          pip install pillow
          python -c "from PIL import Image; Image.open('icon.png').resize((256, 256)).save('icon.ico', format='ICO', sizes=[(256, 256)])"

      - name: Compilar instalador Windows (.exe)
        run: npx electron-builder --win --x64

      - name: Subir EXE generado
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Revival-Windows-EXE
          path: dist/*.exe
          
