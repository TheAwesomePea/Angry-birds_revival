name: Build Windows EXE

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extraer new-game.zip
        shell: bash
        run: unzip -o new-game.zip -d .

      - name: Instalar dependencias y herramientas de icono
        run: |
          npm install
          npm install sharp png-to-ico

      - name: Generar icon.ico de 256x256 desde icon.png
        run: |
          node -e "const sharp = require('sharp'); const pngToIco = require('png-to-ico'); sharp('icon.png').resize(256, 256).png().toBuffer().then(buf => pngToIco(buf)).then(ico => require('fs').writeFileSync('icon.ico', ico));"

      - name: Compilar instalador Windows (.exe)
        run: npx electron-builder --win --x64

      - name: Subir EXE generado
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Revival-1.0.1
          path: dist/*.exe
          
