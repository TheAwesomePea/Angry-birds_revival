name: Warning & Moderation Monitor

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  pull_request:
    types: [opened, edited]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  warning-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Run Warning & Moderation Agent
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_BAN_TOKEN: ${{ secrets.ADMIN_BAN_TOKEN }}
        with:
          script: |
            const owner = 'TheAwesomePea';
            const repo = context.repo.repo;
            const now = Date.now();
            const actor = context.actor;
            if (actor.endsWith('[bot]')) return;

            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', creator: 'github-actions[bot]' });
            let reg = issues.find(i => i.title === '🛡️ [System] Active Mutes Registry');
            let mutes = {};
            if (reg?.body) {
              const m = reg.body.match(/```json\n([\s\(\S\)]*?)\n```/);
              if (m) try { mutes = JSON.parse(m.at(1)); } catch {}
            }

            let changed = false;
            for (const u of Object.keys(mutes)) {
              if (mutes[u].expiresAt && now >= mutes[u].expiresAt) {
                mutes[u].expiresAt = null;
                changed = true;
              }
            }

            const save = async () => {
              const body = `Registro automático de sanciones.\n\n\`\`\`json\n${JSON.stringify(mutes, null, 2)}\n\`\`\``;
              if (reg) await github.rest.issues.update({ owner, repo, issue_number: reg.number, body });
              else reg = (await github.rest.issues.create({ owner, repo, title: '🛡️ [System] Active Mutes Registry', body })).data;
            };

            if (context.eventName === 'schedule') { if (changed) await save(); return; }

            const banish = async (target) => {
              if (!process.env.ADMIN_BAN_TOKEN) return 'Falta ADMIN_BAN_TOKEN para bloqueo automático.';
              const adm = github.getOctokit(process.env.ADMIN_BAN_TOKEN);
              try { await adm.rest.repos.removeCollaborator({ owner, repo, username: target }); } catch {}
              try { await adm.rest.users.block({ username: target }); return `🔨 @${target} desterrado y bloqueado.`; }
              catch { return `⚠️ Error al bloquear a @${target}.`; }
            };

            if (actor.toLowerCase() === owner.toLowerCase()) {
              if (context.eventName === 'issue_comment') {
                const txt = context.payload.comment.body.trim();
                const num = context.payload.issue.number;
                const b = txt.match(/^\/ban\s+@?([a-zA-Z0-9-]+)/i);
                if (b) await github.rest.issues.createComment({ owner, repo, issue_number: num, body: await banish(b.at(1)) });
                const u = txt.match(/^\/unmute\s+@?([a-zA-Z0-9-]+)/i);
                if (u) {
                  delete mutes[u.at(1)]; await save();
                  await github.rest.issues.createComment({ owner, repo, issue_number: num, body: `✅ @${u.at(1)} desbloqueado.` });
                }
              }
              if (changed) await save();
              return;
            }

            const delContent = async () => {
              if (context.eventName === 'issue_comment') {
                await github.rest.issues.deleteComment({ owner, repo, comment_id: context.payload.comment.id });
              } else {
                const num = context.payload.issue?.number || context.payload.pull_request?.number;
                await github.rest.issues.update({ owner, repo, issue_number: num, state: 'closed' });
              }
            };

            if (mutes[actor]?.expiresAt && now < mutes[actor].expiresAt) {
              await delContent(); if (changed) await save(); return;
            }

            let text = '', url = '';
            if (context.eventName === 'issues') { text = `${context.payload.issue.title}\n${context.payload.issue.body || ''}`; url = context.payload.issue.html_url; }
            if (context.eventName === 'issue_comment') { text = context.payload.comment.body || ''; url = context.payload.comment.html_url; }
            if (context.eventName === 'pull_request') { text = `${context.payload.pull_request.title}\n${context.payload.pull_request.body || ''}`; url = context.payload.pull_request.html_url; }
            if (!text) return;

            const res = await fetch(`https://googleapis.com{process.env.GEMINI_API_KEY}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: 'Moderador de @TheAwesomePea en Angry Birds Revival. Clasifica: "none" (normal), "warning" (grosero/inapropiado leve, silencio 3 o 5 días), "banish" (odio/racismo/acoso grave/sabotaje). Responde SOLO JSON: {"severity":"none"|"warning"|"banish","mute_days":3|5,"reason":"motivo en español"}' }] },
                contents: [{ parts: [{ text: `Usuario: ${actor}\nMensaje:\n${text}` }] }],
                generationConfig: { responseMimeType: 'application/json' }
              })
            });

            let v = { severity: 'none', mute_days: 3, reason: '' };
            try { v = JSON.parse((await res.json()).candidates.at(0).content.parts.at(0).text); } catch { return; }
            if (v.severity === 'none') { if (changed) await save(); return; }

            const warns = mutes[actor]?.warnings || 0;
            if (v.severity === 'warning' && warns < 1) {
              const days = v.mute_days === 5 ? 5 : 3;
              mutes[actor] = { expiresAt: now + days * 86400000, days, warnings: 1 };
              await save();
              const msg = `@${actor} **Warning:** Do not make rude or inappropriate comments, racist/narcissistic jokes, memes insulting other users, or harass anyone. For now, you will not be able to send messages for **${days} days**.`;
              const num = context.payload.issue?.number || context.payload.pull_request?.number;
              await github.rest.issues.createComment({ owner, repo, issue_number: num, body: msg });
              await delContent();
              await github.rest.issues.create({ owner, repo, title: `⚠️ [Warning] @${actor} (${days}d)`, body: `Hola @${owner}, **@${actor}** fue silenciado ${days} días.\n* **Motivo:** ${v.reason}\n* **Link:** ${url}` });
            } else {
              await delContent();
              const banRes = await banish(actor);
              delete mutes[actor];
              await save();
              await github.rest.issues.create({ owner, repo, title: `🚨 [Banish] @${actor} desterrado`, body: `Hola @${owner}, **@${actor}** fue sancionado.\n* **Motivo:** ${v.reason}\n* **Acción:** ${banRes}\n* **Link:** ${url}` });
            }
            
