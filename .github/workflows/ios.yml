name: Build iOS Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Capacitor iOS
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios @capacitor/assets

      - name: Descomprimir new-game.zip en www
        run: |
          mkdir -p www
          unzip -o new-game.zip -d www/

      - name: Preparar icono opaco 1024x1024 con sips
        run: |
          mkdir -p assets
          sips -s format jpeg -s formatOptions 100 icon.png --out assets/icon_opaque.jpg
          sips -s format png -z 1024 1024 assets/icon_opaque.jpg --out assets/icon.png
          rm -f assets/icon_opaque.jpg

      - name: Inicializar proyecto iOS con Swift Package Manager (SPM)
        run: |
          npx cap init "Angry Birds Revival" "com.luiginumbertwo222.angrybirdsrevival" --web-dir www
          npx cap add ios --packagemanager SPM
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" ios/App/App.xcodeproj/project.pbxproj
          npx capacitor-assets generate --ios --assetPath assets
          npx cap copy ios

      - name: Compilar aplicación iOS sin firma (xcodebuild)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Empaquetar archivo .IPA instalable
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r Angry-Birds-Revival-iOS.ipa Payload

      - name: Subir IPA a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Angry-Birds-Revival-iOS-IPA
          path: Angry-Birds-Revival-iOS.ipa
          
